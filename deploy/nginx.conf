# REIT-AI 申报系统 Nginx 反代（步骤 3.7）
# 前端由后端同端口托管（同源），所有请求直接转发给 app 容器。
# 后续拿到域名后，在此 server 块上叠 certbot/Let's Encrypt 即可升级 HTTPS。
server {
    listen 80;
    server_name _;

    # 材料 zip 可能上百 MB，放宽上传大小限制（后端另有 2GB 解压上限兜底）
    client_max_body_size 512m;

    # 压缩传输：drawio 核心 JS 9MB+，不压缩时小带宽下加载超时导致画图 502/白屏
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 单章 Kimi 生成可能要几分钟：超时放宽到 10 分钟
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # drawio 等内置静态资源：首次加载后长缓存，避免每次打开画图都重传 9MB
    location /vendor/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000";
        proxy_read_timeout 300s;
    }
}
