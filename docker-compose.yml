# REIT-AI 申报系统生产编排（步骤 3.7）
# 用法：把 .env 放到本目录后执行 `docker compose up -d --build`
services:
  app:
    build: .
    restart: always
    env_file: .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DATA_SOURCE_BASE: /app/workspace
      WEB_CONCURRENCY: "1"
    volumes:
      # 数据库 + 项目数据 + 生成产物全在 workspace 下，挂卷持久化（重启容器数据不丢）
      - ./data/workspace:/app/workspace
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
